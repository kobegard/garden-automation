# Board 04 — Environment Sensor. One I2C bus on the V3V (3.28 V) buck rail.
#   SCL = GPIO5 (D1, P1.3), SDA = GPIO4 (D2, P1.4)   [2026-09-18 review, V]
#   0x76 BME280 (SK1)   0x62 SCD41 (SK3)
#   0x39 AS7343 (CN1)   0x3A MLX90632 (chained off the AS7343 breakout)
#
# AS7343 and MLX90632 use this repo's external components (esphome/components),
# ported from Adafruit's CircuitPython drivers. Not yet run on hardware.

external_components:
  - source:
      type: local
      path: components
    components: [as7343, mlx90632]

i2c:
  sda: GPIO4
  scl: GPIO5
  frequency: 100kHz
  scan: true

sensor:
  - platform: bme280_i2c
    address: 0x76
    update_interval: 30s
    temperature:
      id: air_temp
      name: "Air temperature"
      oversampling: 2x
    humidity:
      id: air_rh
      name: "Air humidity"
      oversampling: 2x
    pressure:
      id: air_pressure
      name: "Air pressure"
      oversampling: 2x

  - platform: scd4x
    address: 0x62
    update_interval: 30s
    measurement_mode: periodic
    ambient_pressure_compensation_source: air_pressure
    co2:
      id: co2
      name: "CO2"
    # SCD41 T/RH sit next to its own heater; BME280 is the room reference.
    temperature:
      name: "SCD41 temperature"
      entity_category: diagnostic
    humidity:
      name: "SCD41 humidity"
      entity_category: diagnostic

  # Canopy (leaf) temperature, MLX90632 looking down through the box floor.
  - platform: mlx90632
    address: 0x3A
    update_interval: 10s
    emissivity: 0.95
    object:
      id: leaf_temp
      name: "Leaf temperature"
      filters:
        - sliding_window_moving_average:
            window_size: 6
            send_every: 3
    ambient:
      name: "MLX90632 die temperature"
      entity_category: diagnostic

  # Light. "PAR" is a sum of the 400-700 nm channels and is NOT calibrated:
  # fit par_factor against a quantum (PAR) meter under the SE7000s, with the
  # PTFE diffuser in place. Until then use it as a relative trend only.
  - platform: as7343
    address: 0x39
    update_interval: 30s
    par:
      name: "PAR (uncalibrated)"
    par_factor: 1.0
    clear:
      name: "Light clear channel"
      entity_category: diagnostic
    fz_450nm:
      name: "Light 450 nm"
    f6_640nm:
      name: "Light 640 nm"
    f7_690nm:
      name: "Light 690 nm"
    f8_745nm:
      name: "Light 745 nm"

  - platform: template
    name: "Leaf VPD"
    unit_of_measurement: "kPa"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      float tl = id(leaf_temp).state, ta = id(air_temp).state, rh = id(air_rh).state;
      if (isnan(tl) || isnan(ta) || isnan(rh)) return NAN;
      auto svp = [](float t) { return 0.61078f * expf(17.27f * t / (t + 237.3f)); };
      return svp(tl) - svp(ta) * rh / 100.0f;

  # Air VPD (kPa).
  - platform: template
    name: "Air VPD"
    unit_of_measurement: "kPa"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      if (isnan(id(air_temp).state) || isnan(id(air_rh).state)) return NAN;
      float t = id(air_temp).state;
      float svp = 0.61078f * expf(17.27f * t / (t + 237.3f));
      return svp * (1.0f - id(air_rh).state / 100.0f);

  - platform: template
    name: "Dew point"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      if (isnan(id(air_temp).state) || isnan(id(air_rh).state) || id(air_rh).state <= 0) return NAN;
      float t = id(air_temp).state;
      float g = logf(id(air_rh).state / 100.0f) + 17.62f * t / (243.12f + t);
      return 243.12f * g / (17.62f - g);
